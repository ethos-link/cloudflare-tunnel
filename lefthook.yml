pre-commit:
  jobs:
    - name: feature-branch
      run: |
        branch=$(git branch --show-current)
        if [ "$branch" = main ] || [ "$branch" = master ]; then
          echo "Use a feature branch; direct commits to main/master are blocked."
          exit 1
        fi
commit-msg:
  jobs:
    - name: commitlint
      run: bundle exec commitlint --message "$(cat {1})"
