name: Optional GitLab sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    uses: ethos-link/ethos-gemkit/.github/workflows/sync-gitlab.yml@02e6d96cd2110442b61468bdfbe99c5cc9c2fa2f
    with:
      toolkit-ref: 02e6d96cd2110442b61468bdfbe99c5cc9c2fa2f
    secrets:
      GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
      GITLAB_KNOWN_HOSTS: ${{ secrets.GITLAB_KNOWN_HOSTS }}
