name: Optional GitLab sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    uses: ethos-link/ethos-gemkit/.github/workflows/sync-gitlab.yml@0780a40d5305c5df0c5c786f665e7ac2d4c673b9
    with:
      toolkit-ref: 0780a40d5305c5df0c5c786f665e7ac2d4c673b9
    secrets:
      GITLAB_DEPLOY_KEY: ${{ secrets.GITLAB_DEPLOY_KEY }}
      GITLAB_KNOWN_HOSTS: ${{ secrets.GITLAB_KNOWN_HOSTS }}
